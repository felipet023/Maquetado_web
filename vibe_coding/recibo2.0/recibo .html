     index.html
     ========================================= -->
<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Green & Blue Aquamarine</title>

  <!-- CSS -->
  <link rel="stylesheet" href="diseño .css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />

</head>
<body>

  <!-- CONTENEDOR -->
  <main class="page-wrapper">

    <!-- RECIBO -->
    <article class="receipt-card">

      <!-- HEADER -->
      <header class="receipt-header">

        <!-- LOGO -->
        <div class="logo-block">

          <div class="logo-title">
            <span class="logo-green">GREEN</span>
            <span class="logo-leaf">🌿</span>
            <span class="logo-blue">BLUE</span>
          </div>

          <div class="logo-sub">
            a q u a m a r i n e
          </div>

          <div class="logo-tagline">
            Efecto y prevención en la funcionalidad física
          </div>

        </div>

        <!-- SERVICIOS -->
        <div class="services-block">

          <div class="services-row">

            <label class="service-label">
              <input type="checkbox" />
              REHABILITACIÓN
            </label>

            <label class="service-label">
              <input type="checkbox" />
              ENTRETENIMIENTO
            </label>

            <label class="service-label">
              <input type="checkbox" />
              MASAJES
            </label>

            <label class="service-label">
              <input type="checkbox" />
              NATACIÓN
            </label>

          </div>

          <!-- TELÉFONO -->
          <div class="phone-row">

            <span class="phone-icon">📱</span>

            <span class="phone-number">
              318 868 8008 / 310 740 6038
            </span>

          </div>

        </div>

        <!-- NÚMERO -->
        <div class="receipt-number-block">

          <div class="receipt-label">
            RECIBO
          </div>

          <div class="receipt-num-row">

            <span class="receipt-nro">Nº</span>

            <span class="receipt-num">
              0480
            </span>

          </div>

        </div>

      </header>

      <!-- FECHAS -->
      <section class="dates-row">

        <div class="date-group">

          <label class="field-label">
            Fecha Inicio
          </label>

          <div class="date-boxes">

            <input type="text" class="date-box" placeholder="DD" maxlength="2" />

            <input type="text" class="date-box" placeholder="MM" maxlength="2" />

            <input type="text" class="date-box date-box--year" placeholder="AAAA" maxlength="4" />

          </div>

        </div>

        <div class="date-group">

          <label class="field-label">
            Fecha Finalización
          </label>

          <div class="date-boxes">

            <input type="text" class="date-box" placeholder="DD" maxlength="2" />

            <input type="text" class="date-box" placeholder="MM" maxlength="2" />

            <input type="text" class="date-box date-box--year" placeholder="AAAA" maxlength="4" />

          </div>

        </div>

      </section>

      <!-- DATOS -->
      <section class="user-data-section">

        <div class="user-row">

          <div class="field-group field-group--wide">

            <label class="field-label">
              Señor(es):
            </label>

            <input type="text" class="underline-input" />

          </div>

          <div class="field-group field-group--wide">

            <label class="field-label">
              Dirección:
            </label>

            <input type="text" class="underline-input" />

          </div>

        </div>

        <div class="contact-row">

          <div class="field-group field-group--tel">

            <label class="field-label">
              Teléfono:
            </label>

            <input type="text" class="underline-input" />

          </div>

          <div class="field-group">

            <label class="field-label">
              Ciudad:
            </label>

            <input type="text" class="underline-input underline-input--sm" />

          </div>

          <div class="field-group field-group--xs">

            <label class="field-label">
              Edad:
            </label>

            <input type="text" class="underline-input underline-input--xs" />

          </div>

          <div class="field-group field-group--xs">

            <label class="field-label">
              Peso:
            </label>

            <input type="text" class="underline-input underline-input--xs" />

          </div>

          <div class="field-group field-group--xs">

            <label class="field-label">
              Altura:
            </label>

            <input type="text" class="underline-input underline-input--xs" />

          </div>

        </div>

      </section>

      <!-- TABLA -->
      <section class="description-section">

        <table class="description-table">

          <thead>

            <tr>

              <th class="col-desc">
                DESCRIPCIÓN
              </th>

              <th class="col-total">
                VR TOTAL
              </th>

            </tr>

          </thead>

          <tbody>

            <tr>
              <td>
                <input type="text" class="table-input" />
              </td>

              <td>
                <input type="text" class="table-input table-input--right" />
              </td>
            </tr>

            <tr>
              <td>
                <input type="text" class="table-input" />
              </td>

              <td>
                <input type="text" class="table-input table-input--right" />
              </td>
            </tr>

            <tr>
              <td>
                <input type="text" class="table-input" />
              </td>

              <td>
                <input type="text" class="table-input table-input--right" />
              </td>
            </tr>

            <tr>
              <td>
                <input type="text" class="table-input" />
              </td>

              <td>
                <input type="text" class="table-input table-input--right" />
              </td>
            </tr>

          </tbody>

        </table>

      </section>

      <!-- OBSERVACIONES -->
      <section class="observations-section">

        <div class="obs-label">
          OBSERVACIONES
        </div>

        <textarea class="obs-textarea"></textarea>

      </section>

      <!-- TOTAL -->
      <section class="total-section">

        <div class="total-row">

          <span class="total-label">
            TOTAL
          </span>

          <div class="total-value-box">

            <span class="currency-sign">$</span>

            <input type="text" class="total-input" />

          </div>

        </div>

      </section>

      <!-- FIRMAS -->
      <footer class="signatures-section">

        <div class="signature-block">

          <div class="signature-line"></div>

          <p class="signature-label">
            FIRMA DEL INSTRUCTOR
          </p>

        </div>

        <div class="signature-block">

          <div class="signature-line"></div>

          <p class="signature-label">
            FIRMA DEL USUARIO
          </p>

        </div>

      </footer>

    </article>

  </main>

  

  <!-- BOTONES -->
  <div class="buttons-container">

    <button id="downloadPdf" class="action-btn">
      Descargar PD
    </button>

    <button id="newReceipt" class="action-btn secondary-btn">
      Nuevo Recibo
    </button>

  </div>

  <!-- LIBRERÍA PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- JS -->
  <script src="java .script.js"></script>

</body>
</html>
